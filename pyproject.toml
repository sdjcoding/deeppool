[project]
name = "etf-dash"
version = "0.1.0"
description = "DeepPool — KRX ETF analysis Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "finance-datareader>=0.9.96",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_dash"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: hits external network (FDR/Naver); skip in CI",
]
