cache:
  db_path: data/cache.db
  parquet_root: data/holdings

ingest:
  request_sleep_seconds: 0.2
  max_retries: 3
  default_lookback_years: 5

ui:
  default_page_size: 50
  cache_ttl_seconds: 3600

llm:
  # Model to use for AI explanations. Options:
  #   claude-sonnet-4-6  — current Sonnet, $3/$15 per 1M tokens (recommended)
  #   claude-haiku-4-5   — cheaper, $1/$5 per 1M tokens (less nuance)
  #   claude-opus-4-7    — best quality, $5/$25 per 1M tokens (overkill for summaries)
  model: claude-sonnet-4-6
  max_tokens_etf: 700        # ~250 Korean characters
  max_tokens_strategy: 1100  # ~400 Korean characters
